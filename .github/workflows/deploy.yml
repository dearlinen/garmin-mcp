name: Deploy

# Manual only: Actions > Deploy > Run workflow. Pushing to main does not deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Secrets reach this step only, never dependency installation or tests.
      - name: Deploy Worker and secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GARMIN_API_KEY ACCESS_AUD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.env"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'GARMIN_API_KEY=%s\nACCESS_AUD=%s\n' "$GARMIN_API_KEY" "$ACCESS_AUD" > "$secrets_file"
          pnpm wrangler deploy --secrets-file "$secrets_file"
